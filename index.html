<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tablekeeper</title>
<style>body{font:16px system-ui;max-width:850px;margin:2rem auto;padding:0 1rem}form,section{border:1px solid #ddd;border-radius:8px;padding:1rem;margin:1rem 0}label,input,button{margin:.35rem;padding:.4rem}.tables{display:flex;gap:.6rem;flex-wrap:wrap}.table{border:1px solid #aaa;border-radius:6px;padding:.7rem;cursor:pointer}.table.selected{border:3px solid #1769aa}#message{white-space:pre-wrap;background:#f5f5f5;padding:1rem}</style></head>
<body><main><h1>Tablekeeper</h1>
<form id="search"><h2>Find a table</h2><label>Start <input name="start" type="datetime-local" required></label><label>End <input name="end" type="datetime-local" required></label><label>Guests <input name="party_size" type="number" min="1" value="2" required></label><button>Find tables</button><div id="tables" class="tables"></div></form>
<form id="reserve"><h2>Book selected table</h2><input name="customer_name" placeholder="Name" required><input name="customer_email" type="email" placeholder="Email" required><input name="party_size" type="number" min="1" value="2" required><input name="table_id" id="table-id" type="hidden" required><button>Reserve</button></form>
<section><h2>Manage your reservation</h2><label>Reservation ID <input id="reservation-id" required></label><label>Email <input id="owner-email" type="email" required></label><button id="lookup">Look up</button><button id="cancel">Cancel</button><form id="change"><label>New start <input name="start" type="datetime-local" required></label><label>New end <input name="end" type="datetime-local" required></label><label>Guests <input name="party_size" type="number" min="1" required></label><label>Replacement table <select name="table_id" id="change-table"><option value="">Choose automatically</option></select></label><button>Change reservation</button></form><pre id="message"></pre></section>
<script>
const $=s=>document.querySelector(s), iso=v=>new Date(v).toISOString(), msg=d=>$("#message").textContent=typeof d==="string"?d:JSON.stringify(d,null,2);
const showReservation=d=>{const r=d.reservation||d;msg(`Reservation ${r.id}\nStatus: ${r.status}\nTable: ${r.table_name||r.table_id}\nGuests: ${r.party_size}\n${r.start} to ${r.end}\nEmail: ${r.customer_email}`)};
const request=async(url,opt={})=>{const r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d};
const owner=()=>({"X-Reservation-Email":$("#owner-email").value.trim()});
$("#search").addEventListener("submit",async e=>{e.preventDefault();const d=new FormData(e.target);try{const r=await request(`/api/availability?start=${encodeURIComponent(iso(d.get("start")))}&end=${encodeURIComponent(iso(d.get("end")))}&party_size=${d.get("party_size")}`);$("#tables").innerHTML=r.tables.map(t=>`<button type="button" class="table" data-id="${t.id}"><b>${t.name}</b><br>Seats ${t.capacity}</button>`).join("");$("#change-table").innerHTML='<option value="">Choose automatically</option>'+r.tables.map(t=>`<option value="${t.id}">${t.name} (seats ${t.capacity})</option>`).join("");document.querySelectorAll(".table").forEach(b=>b.onclick=()=>{document.querySelectorAll(".table").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");$("#table-id").value=b.dataset.id});}catch(x){msg(x.message)}});
$("#reserve").addEventListener("submit",async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.party_size=Number(d.party_size);const search=new FormData($("#search"));d.start=iso(search.get("start"));d.end=iso(search.get("end"));try{const r=await request("/api/reservations",{method:"POST",headers:{"Content-Type":"application/json","Idempotency-Key":crypto.randomUUID()},body:JSON.stringify(d)});$("#reservation-id").value=r.reservation.id;$("#owner-email").value=d.customer_email;showReservation(r)}catch(x){msg(x.message)}});
$("#lookup").onclick=async()=>{try{showReservation(await request(`/api/reservations/${$("#reservation-id").value}`,{headers:owner()}))}catch(x){msg(x.message)}};
$("#cancel").onclick=async()=>{if(!confirm("Cancel this reservation?"))return;try{showReservation(await request(`/api/reservations/${$("#reservation-id").value}`,{method:"DELETE",headers:{...owner(),"Idempotency-Key":crypto.randomUUID()}}))}catch(x){msg(x.message)}};
$("#change").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.start=iso(d.start);d.end=iso(d.end);d.party_size=Number(d.party_size);if(!d.table_id)delete d.table_id;try{showReservation(await request(`/api/reservations/${$("#reservation-id").value}`,{method:"PATCH",headers:{...owner(),"Content-Type":"application/json","Idempotency-Key":crypto.randomUUID()},body:JSON.stringify(d)}))}catch(x){msg(x.message)}};
</script></main></body></html>
