<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tablekeeper manager</title>
<style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem}form,section{border:1px solid #ddd;border-radius:8px;padding:1rem;margin:1rem 0}label,input,button{margin:.35rem;padding:.4rem}.card{border:1px solid #bbb;border-radius:6px;padding:.7rem;margin:.5rem 0}.danger{color:#a00}#output{white-space:pre-wrap}</style></head>
<body><main><h1>Manager operations</h1><p><strong>Demo only:</strong> use the configured manager token. Change <code>TABLEKEEPER_MANAGER_TOKEN</code> before deployment.</p><label>Manager token <input id="token" type="password" placeholder="demo-manager-token" autocomplete="current-password"></label><button id="refresh">Refresh</button>
<section><h2>Close a table</h2><form id="closure"><input name="table_id" placeholder="Table ID" required><input name="start" type="datetime-local" required><input name="end" type="datetime-local" required><input name="reason" placeholder="Reason" required><button>Create closure</button></form></section>
<section><h2>Draft a proposal</h2><p>The assistant is rules-based: it suggests capacity-fitting alternatives for manager approval.</p><label>Closure <select id="closure-id"></select></label><button id="make-proposal">Create proposal</button><div id="proposals"></div></section><pre id="output"></pre>
<script>
const $=s=>document.querySelector(s),iso=v=>new Date(v).toISOString(),headers=()=>({"X-Manager-Token":$("#token").value}),show=d=>$("#output").textContent=JSON.stringify(d,null,2);
const request=async(url,opt={})=>{const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d};
async function refresh(){try{const [tables,reservations,closures,proposals]=await Promise.all(["tables","reservations","closures","proposals"].map(n=>request(`/api/manager/${n}`)));$("#closure-id").innerHTML=closures.closures.map(c=>`<option value="${c.id}">${c.table_name} ${c.start_utc} - ${c.end_utc}</option>`).join("");$("#proposals").innerHTML=proposals.proposals.map(p=>`<article class="card"><b>${p.id}</b> — ${p.status}<button data-id="${p.id}" class="review">Review changes</button>${p.status==="draft"?`<button data-id="${p.id}" class="approve">Approve</button><button data-id="${p.id}" class="reject">Reject</button>`:""}</article>`).join("");document.querySelectorAll(".review").forEach(b=>b.onclick=async()=>{try{const d=await request(`/api/manager/proposals/${b.dataset.id}`);showProposal(d)}catch(x){show(x.message)}});document.querySelectorAll(".approve").forEach(b=>b.onclick=async()=>{if(!confirm("Apply every safe proposal change atomically?"))return;try{show(await request(`/api/manager/proposals/${b.dataset.id}/approve`,{method:"POST","headers":{"Idempotency-Key":crypto.randomUUID()}}));await refresh()}catch(x){show(x.message)}});document.querySelectorAll(".reject").forEach(b=>b.onclick=async()=>{if(!confirm("Reject this proposal without changing reservations?"))return;try{show(await request(`/api/manager/proposals/${b.dataset.id}/reject`,{method:"POST","headers":{"Idempotency-Key":crypto.randomUUID()}}));await refresh()}catch(x){show(x.message)}});show({tables,reservations,closures,proposals})}catch(x){show(x.message)}}
function showProposal(data){const items=data.items||[];$("#output").textContent=`Proposal ${data.proposal.id} (${data.proposal.status})\n\n`+items.map(item=>`Reservation ${item.reservation_id}\nBefore: ${item.old_start_utc} to ${item.old_end_utc} on table ${item.old_table_id}\nAfter: ${item.new_start_utc} to ${item.new_end_utc} on table ${item.new_table_id}\nReason: ${item.rationale}`).join("\n\n");}
$("#refresh").onclick=refresh;$("#closure").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.start=iso(d.start);d.end=iso(d.end);try{show(await request("/api/manager/closures",{method:"POST",headers:{"Content-Type":"application/json","Idempotency-Key":crypto.randomUUID()},body:JSON.stringify(d)}));await refresh()}catch(x){show(x.message)}};$("#make-proposal").onclick=async()=>{try{show(await request("/api/manager/proposals",{method:"POST",headers:{"Content-Type":"application/json","Idempotency-Key":crypto.randomUUID()},body:JSON.stringify({closure_id:$("#closure-id").value})}));await refresh()}catch(x){show(x.message)}};refresh();
</script></main></body></html>
